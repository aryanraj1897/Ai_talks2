services:
  - type: web
    name: abtalks-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/v1/health
    plan: starter
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma_db_data
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: ABTalks AI Technical Interviewer
    disk:
      name: chroma-storage
      mountPath: /var/data/chroma_db_data
      sizeGB: 10
