name: ABTalks AI Interviewer CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Build & Pytest Job
  test-backend:
    name: Test & Build Backend (FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Pytest Suite with Code Coverage
        run: |
          cd backend
          python -m pytest tests/ --cov=. --cov-report=term-missing

  # 2. Frontend Build & Typecheck Job
  test-frontend:
    name: Test & Build Frontend (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build

  # 3. Docker Compose Verification Job
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Compose Stack
        run: |
          docker-compose build
